{% extends 'base.html' %}
{% block title %}New Expense{% endblock %}
{% block content %}
<h2>New Expense</h2>
<form method="post" enctype="multipart/form-data" action="#">
  <label>Amount <input type="number" step="0.01" name="amount" required></label>
  <label>Currency <input type="text" name="currency" placeholder="USD" required></label>
  <label>Category <input type="text" name="category" required></label>
  <label>Description <input type="text" name="description"></label>
  <label>Date <input type="date" name="date" required></label>
  <label>Receipt Image <input type="file" name="receipt"></label>
  <button type="submit">Submit</button>
</form>
{% endblock %}
