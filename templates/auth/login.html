{% extends "base.html" %}
{% block content %}
<h2>Login</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
  <label>Email</label>
  <input type="email" name="email" required />

  <label>Password</label>
  <input type="password" name="password" required />

  <button type="submit">Login</button>
</form>
{% endblock %}
